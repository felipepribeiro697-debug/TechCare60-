<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>TechCare 60+ – Perfil do idoso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5D66}a:hover{color:#08434A}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #0B5D66;outline-offset:1px}
</style>
<style>
#dc-root{min-height:100vh}
div[role="tablist"]>a{flex:0 0 auto;white-space:nowrap}
@media (max-width: 779px){
  nav[aria-label="Menu principal"]{border-right:none !important;border-bottom:1px solid #D5DBD7;padding:8px 10px !important;gap:0 !important}
  nav[aria-label="Menu principal"]>div{padding:6px 6px !important}
  nav[aria-label="Menu principal"] .nav-burger{display:flex !important}
  nav[aria-label="Menu principal"]>a{display:none !important;margin-top:0 !important}
  nav[aria-label="Menu principal"] .nav-toggle:checked ~ a{display:flex !important;margin-top:2px}
  div[role="tablist"]>a{padding-left:12px !important;padding-right:12px !important}
}
@media (max-width: 819px){#dc-root{padding-bottom:64px}}
.tc-home{position:fixed;right:16px;bottom:16px;z-index:50;font:600 14px/1 system-ui,sans-serif;background:#183236;color:#fff;text-decoration:none;padding:10px 14px;border-radius:999px;opacity:.85}
.tc-home:hover{opacity:1;color:#fff}
</style>
<script src="../assets/store.js"></script>
<script src="../assets/dc-lite.js"></script>

</head>
<body>
<template id="dc-tpl">
<div style="min-height: 1320px; display: flex; flex-wrap: wrap; background: #F4F6F3; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1B1F23">
  <nav aria-label="Menu principal" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 28px 18px; background: #FFFFFF; border-right: 1px solid #D5DBD7; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px 22px">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
        <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #0B5D66; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
        </div>
        <div style="font-size: 19px; font-weight: 700">TechCare 60+</div>
      </div>
      <label for="navToggle" class="nav-burger" role="button" tabindex="0" aria-label="Abrir ou fechar o menu" style="display: none; flex-shrink: 0; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 10px; border: 1px solid #D5DBD7; background: #FFFFFF; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </label>
    </div>
    <input type="checkbox" id="navToggle" class="nav-toggle" hidden>
    <a href="Prof-Idosos.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; background: #E3F0F1; color: #08434A; font-weight: 700; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M22 21a6 6 0 0 0-4-5.7"/></svg>
      Idosos
    </a>
    <a href="Prof-Plano.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; color: #2B333A; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Catálogo de atividades
    </a>
    <a href="Prof-Relatorio.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; color: #2B333A; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      Relatórios
    </a>
    <a href="Prof-Login.html" style="margin-top: 24px; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; color: #2B333A; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Sair
    </a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: clamp(16px, 4vw, 32px) clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 22px">
    <div style="font-size: 15px; color: #4A5560"><a href="Prof-Idosos.html">Idosos</a> › {{nome}}</div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px">
      <div style="width: 64px; height: 64px; border-radius: 32px; background: #E3F0F1; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #0B5D66">{{inicial}}</div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 28px">{{nome}}</h1>
        <div style="font-size: 15px; color: #4A5560">{{subtitulo}}</div>
      </div>
    </div>

    <div role="tablist" style="display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; border-bottom: 2px solid #D5DBD7">
      <a href="Prof-Perfil.html" style="padding: 12px 18px; font-size: 16px; font-weight: 700; color: #08434A; border-bottom: 3px solid #0B5D66; margin-bottom: -2px; text-decoration: none">Perfil</a>
      <a href="Prof-Plano.html" style="padding: 12px 18px; font-size: 16px; color: #2B333A; text-decoration: none">Plano de atividades</a>
      <a href="Prof-Relatorio.html" style="padding: 12px 18px; font-size: 16px; color: #2B333A; text-decoration: none">Evolução</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 20px">
      <section style="background: #FFFFFF; border: 1px solid #D5DBD7; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 19px">Dados básicos</h2>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="nome" style="font-size: 14px; font-weight: 700">Nome completo</label>
          <input id="nome" value="{{nome}}" style="font-family: inherit; font-size: 16px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA6A0; border-radius: 10px">
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="nasc" style="font-size: 14px; font-weight: 700">Data de nascimento</label>
            <input id="nasc" value="{{nascimento}}" style="font-family: inherit; font-size: 16px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA6A0; border-radius: 10px">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pin" style="font-size: 14px; font-weight: 700">PIN de acesso</label>
            <input id="pin" type="password" value="{{pin}}" style="font-family: inherit; font-size: 16px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA6A0; border-radius: 10px">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="obj" style="font-size: 14px; font-weight: 700">Objetivos do acompanhamento</label>
          <textarea id="obj" rows="4" style="font-family: inherit; font-size: 16px; line-height: 1.45; box-sizing: border-box; padding: 10px 12px; border: 1px solid #9AA6A0; border-radius: 10px; resize: vertical">{{objetivos}}</textarea>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="obs" style="font-size: 14px; font-weight: 700">Observações</label>
          <textarea id="obs" rows="3" style="font-family: inherit; font-size: 16px; line-height: 1.45; box-sizing: border-box; padding: 10px 12px; border: 1px solid #9AA6A0; border-radius: 10px; resize: vertical">{{observacoes}}</textarea>
        </div>
      </section>

      <div style="display: flex; flex-direction: column; gap: 20px">
        <section style="background: #FFFFFF; border: 1px solid #D5DBD7; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 19px">Acessibilidade no app</h2>
          <p style="margin: 0; font-size: 14px; color: #4A5560">Ajustes aplicados no tablet do idoso.</p>
          <template data-k="for" list="{{toggles}}" as="t" hint-placeholder-count="3">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 6px 0">
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 700">{{t.label}}</span>
                <span style="font-size: 14px; color: #4A5560">{{t.desc}}</span>
              </div>
              <button onClick="{{t.toggle}}" aria-pressed="{{t.on}}" aria-label="{{t.label}}" style="{{t.track}}">
                <span style="{{t.knob}}"></span>
              </button>
            </div>
          </template>
        </section>

        <section style="background: #FFFFFF; border: 1px solid #D5DBD7; border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 19px">Cuidador ou familiar</h2>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="cuid" style="font-size: 14px; font-weight: 700">Nome</label>
              <input id="cuid" value="{{cuidadorNome}}" style="font-family: inherit; font-size: 16px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA6A0; border-radius: 10px">
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <label for="tel" style="font-size: 14px; font-weight: 700">Celular</label>
              <input id="tel" value="{{cuidadorTel}}" style="font-family: inherit; font-size: 16px; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #9AA6A0; border-radius: 10px">
            </div>
          </div>
          <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45">
            <input type="checkbox" id="autoriza" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #0B5D66">
            Autorizado a receber lembretes e o relatório mensal
          </label>
        </section>
      </div>
    </div>

    <section style="background: #E4EEE6; border: 1px solid #9CC3A8; border-radius: 14px; padding: 20px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
      <div style="display: flex; gap: 14px; align-items: flex-start">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14532B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 16px; font-weight: 700; color: #14532B">Consentimento para uso dos dados registrado</div>
          <div style="font-size: 14px; color: #1B1F23">Assinado pela própria idosa em 04/08/2026 · finalidade: acompanhamento fonoaudiológico (LGPD)</div>
        </div>
      </div>
      <div style="display: flex; gap: 14px; flex-wrap: wrap">
        <a href="#" style="font-size: 15px; font-weight: 700">Ver termo</a>
        <a href="#" style="font-size: 15px; font-weight: 700; color: #9A3A0C">Revogar consentimento</a>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px">
      <a href="Prof-Idosos.html" style="display: flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 10px; border: 1px solid #9AA6A0; background: #FFFFFF; color: #1B1F23; font-size: 16px; font-weight: 700; text-decoration: none">Cancelar</a>
      <a href="Prof-Plano.html" onClick="{{salvar}}" style="display: flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 10px; background: #0B5D66; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Salvar e ir para o plano</a>
    </div>
  </main>
</div>
</template>
<div id="dc-root"></div>
<a class="tc-home" href="../index.html">Início</a>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1280,"height":1320}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.idoso = (window.TC ? TC.current() : null) || {
      id: 'maria', nome: 'Maria Aparecida Souza', idade: 72, nascimento: '12/03/1954', pin: '1234',
      objetivos: '', observacoes: '', cuidadorNome: '', cuidadorTel: '', autoriza: true,
      acess: { fonte: true, contraste: false, audio: true }, desde: '04/08/2026'
    };
    this.acess = Object.assign({ fonte: false, contraste: false, audio: true }, this.idoso.acess || {});
  }
  componentDidMount() {
    const chk = document.getElementById('autoriza');
    if (chk) chk.checked = !!this.idoso.autoriza;
  }
  salvar() {
    const g = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };
    const chk = document.getElementById('autoriza');
    if (window.TC) TC.update(this.idoso.id, {
      nome: g('nome').trim() || this.idoso.nome,
      nascimento: g('nasc').trim(),
      pin: g('pin').trim(),
      objetivos: g('obj'),
      observacoes: g('obs'),
      cuidadorNome: g('cuid').trim(),
      cuidadorTel: g('tel').trim(),
      autoriza: chk ? !!chk.checked : !!this.idoso.autoriza,
      acess: this.acess
    });
  }
  renderVals() {
    const self = this;
    const i = this.idoso;
    const inicial = ((i.nome || '?').trim().charAt(0) || '?').toUpperCase();
    const partes = [];
    if (i.idade !== '' && i.idade != null) partes.push(i.idade + ' anos');
    if (i.desde) partes.push('em acompanhamento desde ' + i.desde);
    partes.push('dados fictícios');
    const defs = [
      { key: 'fonte', label: 'Letra grande', desc: 'Aumenta o texto em todas as telas' },
      { key: 'contraste', label: 'Alto contraste', desc: 'Cores mais fortes e fundo escuro' },
      { key: 'audio', label: 'Instruções em áudio', desc: 'Lê as instruções em voz alta' }
    ];
    const toggles = defs.map(function (d) {
      const on = !!self.acess[d.key];
      return {
        label: d.label, desc: d.desc, on: on ? 'true' : 'false',
        track: 'flex-shrink: 0; width: 56px; height: 32px; border-radius: 16px; border: none; padding: 3px; cursor: pointer; display: flex; box-sizing: border-box; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#0B5D66' : '#8A958F'),
        knob: 'width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block',
        toggle: function (e) {
          self.acess[d.key] = !self.acess[d.key];
          const on2 = self.acess[d.key];
          const btn = e && e.currentTarget;
          if (btn) {
            btn.style.background = on2 ? '#0B5D66' : '#8A958F';
            btn.style.justifyContent = on2 ? 'flex-end' : 'flex-start';
            btn.setAttribute('aria-pressed', on2 ? 'true' : 'false');
          }
          if (window.TC) TC.update(self.idoso.id, { acess: self.acess });
        }
      };
    });
    return {
      nome: i.nome, inicial: inicial, subtitulo: partes.join(' · '),
      nascimento: i.nascimento || '', pin: i.pin || '',
      objetivos: i.objetivos || '', observacoes: i.observacoes || '',
      cuidadorNome: i.cuidadorNome || '', cuidadorTel: i.cuidadorTel || '',
      toggles: toggles,
      salvar: function () { self.salvar(); }
    };
  }
}
</script>
</body>
</html>
