<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>TechCare 60+ – Plano de atividades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5D66}a:hover{color:#08434A}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #0B5D66;outline-offset:1px}
</style>
<style>
#dc-root{min-height:100vh}
div[role="tablist"]>a{flex:0 0 auto;white-space:nowrap}
@media (max-width: 779px){
  nav[aria-label="Menu principal"]{border-right:none !important;border-bottom:1px solid #D5DBD7;padding:8px 10px !important;gap:0 !important}
  nav[aria-label="Menu principal"]>div{padding:6px 6px !important}
  nav[aria-label="Menu principal"] .nav-burger{display:flex !important}
  nav[aria-label="Menu principal"]>a{display:none !important;margin-top:0 !important}
  nav[aria-label="Menu principal"] .nav-toggle:checked ~ a{display:flex !important;margin-top:2px}
  div[role="tablist"]>a{padding-left:12px !important;padding-right:12px !important}
}
@media (max-width: 819px){#dc-root{padding-bottom:64px}}
.tc-home{position:fixed;right:16px;bottom:16px;z-index:50;font:600 14px/1 system-ui,sans-serif;background:#183236;color:#fff;text-decoration:none;padding:10px 14px;border-radius:999px;opacity:.85}
.tc-home:hover{opacity:1;color:#fff}
</style>
<script src="../assets/store.js"></script>
<script src="../assets/dc-lite.js"></script>

</head>
<body>
<template id="dc-tpl">
<div style="min-height: 1100px; display: flex; flex-wrap: wrap; background: #F4F6F3; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1B1F23">
  <nav aria-label="Menu principal" style="flex: 1 1 220px; max-width: 100%; box-sizing: border-box; padding: 28px 18px; background: #FFFFFF; border-right: 1px solid #D5DBD7; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px 22px">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
        <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #0B5D66; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>
        </div>
        <div style="font-size: 19px; font-weight: 700">TechCare 60+</div>
      </div>
      <label for="navToggle" class="nav-burger" role="button" tabindex="0" aria-label="Abrir ou fechar o menu" style="display: none; flex-shrink: 0; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 10px; border: 1px solid #D5DBD7; background: #FFFFFF; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </label>
    </div>
    <input type="checkbox" id="navToggle" class="nav-toggle" hidden>
    <a href="Prof-Idosos.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; background: #E3F0F1; color: #08434A; font-weight: 700; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11a3 3 0 1 0 0-6M22 21a6 6 0 0 0-4-5.7"/></svg>
      Idosos
    </a>
    <a href="Prof-Plano.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; color: #2B333A; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Catálogo de atividades
    </a>
    <a href="Prof-Relatorio.html" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; color: #2B333A; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      Relatórios
    </a>
    <a href="Prof-Login.html" style="margin-top: 24px; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; color: #2B333A; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Sair
    </a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: clamp(16px, 4vw, 32px) clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 22px">
    <div style="font-size: 15px; color: #4A5560"><a href="Prof-Idosos.html">Idosos</a> › <a href="Prof-Perfil.html">{{nome}}</a> › Plano de atividades</div>
    <h1 style="margin: 0; font-size: 28px">Plano de atividades – {{primeiro}}</h1>

    <div role="tablist" style="display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; border-bottom: 2px solid #D5DBD7">
      <a href="Prof-Perfil.html" style="padding: 12px 18px; font-size: 16px; color: #2B333A; text-decoration: none">Perfil</a>
      <a href="Prof-Plano.html" style="padding: 12px 18px; font-size: 16px; font-weight: 700; color: #08434A; border-bottom: 3px solid #0B5D66; margin-bottom: -2px; text-decoration: none">Plano de atividades</a>
      <a href="Prof-Relatorio.html" style="padding: 12px 18px; font-size: 16px; color: #2B333A; text-decoration: none">Evolução</a>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section id="catCard" style="flex: 1 1 min(380px, 100%); min-width: 0; background: #FFFFFF; border: 1px solid #D5DBD7; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-size: 19px">Catálogo</h2>
          <p style="margin: 0; font-size: 14px; color: #4A5560">Sugestões iniciais, a validar com a fonoaudióloga.</p>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px" aria-label="Filtrar por categoria">
          <template data-k="for" list="{{chips}}" as="ch" hint-placeholder-count="4">
            <button onClick="{{ch.pick}}" aria-pressed="{{ch.on}}" style="{{ch.style}}">{{ch.label}}</button>
          </template>
        </div>
        <template data-k="for" list="{{catalog}}" as="a" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 14px; padding: 12px; border: 1px solid #E1E6E2; border-radius: 12px">
            <div style="{{a.dot}}"></div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 16px; font-weight: 700">{{a.nome}}</span>
              <span style="font-size: 14px; color: #4A5560">{{a.cat}} · {{a.desc}}</span>
            </div>
            <template data-k="if" value="{{a.inPlan}}" hint-placeholder-val="{{ false }}">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #1E6B3A; white-space: nowrap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E6B3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
                No plano
              </span>
            </template>
            <template data-k="if" value="{{a.notInPlan}}" hint-placeholder-val="{{ true }}">
              <button onClick="{{a.add}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #0B5D66; background: #FFFFFF; color: #0B5D66; font-size: 15px; font-weight: 700; white-space: nowrap">Adicionar</button>
            </template>
          </div>
        </template>
      </section>

      <section id="planCard" style="flex: 1 1 min(420px, 100%); min-width: 0; background: #FFFFFF; border: 1px solid #D5DBD7; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <h2 style="margin: 0; font-size: 19px">Plano atual</h2>
          <span style="font-size: 14px; color: #4A5560">{{count}} atividades</span>
        </div>
        <div id="planScroll" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; flex: 1 1 auto; padding-right: 4px">
        <template data-k="for" list="{{plan}}" as="p" hint-placeholder-count="3">
          <div style="border: 1px solid #D5DBD7; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
              <div style="display: flex; align-items: center; gap: 10px">
                <div style="{{p.dot}}"></div>
                <span style="font-size: 16px; font-weight: 700">{{p.nome}}</span>
              </div>
              <button onClick="{{p.remove}}" aria-label="Remover do plano" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #C9D1CC; background: #FFFFFF; color: #9A3A0C; font-size: 14px; font-weight: 700">Remover</button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; font-size: 14px">
              <div style="background: #F4F6F3; border-radius: 8px; padding: 8px 10px"><span style="color: #4A5560">Nível</span><br><b>{{p.nivel}}</b></div>
              <div style="background: #F4F6F3; border-radius: 8px; padding: 8px 10px"><span style="color: #4A5560">Frequência</span><br><b>{{p.freq}}</b></div>
              <div style="background: #F4F6F3; border-radius: 8px; padding: 8px 10px"><span style="color: #4A5560">Onde</span><br><b>{{p.local}}</b></div>
              <div style="background: #F4F6F3; border-radius: 8px; padding: 8px 10px"><span style="color: #4A5560">Lembrete</span><br><b>{{p.lembrete}}</b></div>
            </div>
          </div>
        </template>
        <template data-k="if" value="{{empty}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 24px; border: 2px dashed #C9D1CC; border-radius: 12px; text-align: center; font-size: 15px; color: #4A5560">Nenhuma atividade no plano. Adicione pelo catálogo.</div>
        </template>
        </div>
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #4A5560; line-height: 1.5">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Atividades marcadas para casa aparecem no app da idosa só nos dias definidos, com lembrete no horário escolhido.
        </div>
        <a href="Prof-Relatorio.html" style="align-self: flex-end; display: flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 10px; background: #0B5D66; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">Salvar plano</a>
      </section>
    </div>
  </main>
</div>
</template>
<div id="dc-root"></div>
<a class="tc-home" href="../index.html">Início</a>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.idoso = (window.TC ? TC.current() : null) || { id: 'maria', nome: 'Maria Aparecida Souza', plano: ['m1', 'a1', 'l1'] };
    this.state = { filter: 'todas', plan: (this.idoso.plano || []).slice() };
    this.cats = {
      mem: { label: 'Memória', color: '#0B5D66' },
      at: { label: 'Atenção', color: '#B4430F' },
      lin: { label: 'Linguagem', color: '#5B3F9E' }
    };
    this.items = [
      { id: 'm1', cat: 'mem', nome: 'Jogo da memória', desc: 'pares de figuras', nivel: 'Fácil (4 pares)', freq: '3x por semana', local: 'Atendimento e casa', lembrete: '10h' },
      { id: 'm2', cat: 'mem', nome: 'Lembrar a sequência', desc: 'repetir ordem de itens', nivel: 'Fácil (3 itens)', freq: '2x por semana', local: 'Casa', lembrete: '10h' },
      { id: 'm3', cat: 'mem', nome: 'Lista de compras', desc: 'memorizar e recordar', nivel: 'Médio', freq: '1x por semana', local: 'Atendimento', lembrete: '—' },
      { id: 'a1', cat: 'at', nome: 'Encontre o diferente', desc: 'achar a figura que muda', nivel: 'Fácil', freq: '1x por semana', local: 'Atendimento', lembrete: '—' },
      { id: 'a2', cat: 'at', nome: 'Siga as cores', desc: 'tocar na ordem indicada', nivel: 'Fácil', freq: '2x por semana', local: 'Casa', lembrete: '11h' },
      { id: 'l1', cat: 'lin', nome: 'Complete a frase', desc: 'escolher a palavra certa', nivel: 'Fácil', freq: '3x por semana', local: 'Casa', lembrete: '15h' },
      { id: 'l2', cat: 'lin', nome: 'Nomeie a figura', desc: 'dizer o nome do objeto', nivel: 'Médio', freq: '2x por semana', local: 'Atendimento', lembrete: '—' },
      { id: 'l3', cat: 'lin', nome: 'Palavra e imagem', desc: 'associar palavra à figura', nivel: 'Fácil', freq: '2x por semana', local: 'Casa', lembrete: '16h' }
    ];
  }
  dot(cat) { return 'width: 14px; height: 14px; flex-shrink: 0; border-radius: 7px; background: ' + this.cats[cat].color; }
  syncHeights() {
    const cat = document.getElementById('catCard');
    const plan = document.getElementById('planCard');
    if (!cat || !plan) return;
    if (window.innerWidth < 780) { plan.style.height = ''; plan.style.maxHeight = ''; return; }
    plan.style.boxSizing = 'border-box';
    const h = cat.offsetHeight;
    plan.style.height = h + 'px';
    plan.style.maxHeight = h + 'px';
  }
  componentDidMount() {
    const self = this;
    this.syncHeights();
    this._onResize = function () { self.syncHeights(); };
    window.addEventListener('resize', this._onResize);
    setTimeout(function () { self.syncHeights(); }, 300);
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { self.syncHeights(); }); } catch (e) { }
  }
  componentWillUnmount() {
    if (this._onResize) window.removeEventListener('resize', this._onResize);
  }
  renderVals() {
    const { filter, plan } = this.state;
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => this.syncHeights());
    const nome = this.idoso.nome || 'Idoso';
    const primeiro = (nome.trim().split(/\s+/)[0]) || nome;
    const chipDefs = [{ id: 'todas', label: 'Todas' }, { id: 'mem', label: 'Memória' }, { id: 'at', label: 'Atenção' }, { id: 'lin', label: 'Linguagem' }];
    const chips = chipDefs.map((c) => {
      const on = c.id === filter;
      return {
        label: c.label, on: on ? 'true' : 'false',
        style: 'height: 38px; padding: 0 16px; border-radius: 19px; font-size: 15px; font-weight: 700; border: 1px solid ' + (on ? '#0B5D66' : '#9AA6A0') + '; background: ' + (on ? '#0B5D66' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#1B1F23'),
        pick: () => this.setState({ filter: c.id })
      };
    });
    const catalog = this.items.filter((i) => filter === 'todas' || i.cat === filter).map((i) => ({
      ...i, cat: this.cats[i.cat].label, dot: this.dot(i.cat),
      inPlan: plan.includes(i.id), notInPlan: !plan.includes(i.id),
      add: () => {
        const np = this.state.plan.indexOf(i.id) >= 0 ? this.state.plan : this.state.plan.concat([i.id]);
        if (window.TC) TC.update(this.idoso.id, { plano: np });
        this.setState({ plan: np });
      }
    }));
    const planList = plan.map((id) => this.items.find((i) => i.id === id)).filter(Boolean).map((i) => ({
      ...i, dot: this.dot(i.cat),
      remove: () => {
        const np = this.state.plan.filter((x) => x !== i.id);
        if (window.TC) TC.update(this.idoso.id, { plano: np });
        this.setState({ plan: np });
      }
    }));
    return { nome, primeiro, chips, catalog, plan: planList, count: planList.length, empty: planList.length === 0 };
  }
}
</script>
</body>
</html>
