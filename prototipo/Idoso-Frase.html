<!doctype html>
<html lang="pt-BR" data-app="idoso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>TechCare 60+ – Complete a frase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
h1{overflow-wrap:anywhere}
body{margin:0}
a{color:#0B5D66}a:hover{color:#08434A}
.opt{font-family:inherit;cursor:pointer}
.opt[aria-disabled="true"]{cursor:default}
</style>
<style>
body{background:#DDE3DF}
#dc-root>*{background-color:#F4F6F3}
@media (min-width: 820px){
  #dc-root{padding:24px 0}
  #dc-root>*{min-height:calc(100vh - 48px) !important;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden}
}
</style>
<script src="../assets/tema.js"></script>
<script src="../assets/store.js"></script>
<script src="../assets/dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; max-width: 768px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: clamp(16px, 5.73vw, 44px) clamp(16px, 7.29vw, 56px); display: flex; flex-direction: column; gap: 26px; background: #F4F6F3; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1B1F23">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Idoso-Hoje.html" style="display: flex; align-items: center; gap: 10px; font-size: clamp(18px, 3.12vw, 24px); font-weight: 700; text-decoration: none; padding: 12px 20px 12px 8px; border-radius: 16px; background: #FFFFFF; border: 2px solid #C9D1CC; color: #1B1F23">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Voltar
    </a>
    <div style="font-size: 20px; font-weight: 700; color: #5B3F9E; background: #ECE6F7; padding: 10px 18px; border-radius: 14px; letter-spacing: 0.5px">LINGUAGEM</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: clamp(34px, 6.77vw, 52px); line-height: 1.1">Complete a frase</h1>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
      <div aria-live="polite" style="font-size: clamp(18px, 3.65vw, 26px); font-weight: 700; color: #2B333A">Frase {{numero}} de {{total}}</div>
      <div style="display: flex; gap: 8px" aria-hidden="true">
        <template data-k="for" list="{{passos}}" as="p" hint-placeholder-count="5">
          <div style="{{p.style}}"></div>
        </template>
      </div>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 2px solid #C9D1CC; border-radius: 28px; padding: clamp(22px, 5vw, 40px); display: flex; flex-direction: column; gap: 22px; align-items: center">
    <button class="tc-ouvir" onClick="{{ouvir}}" aria-label="Ouvir a frase" style="font-family: inherit; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px; border-radius: 16px; border: 2px solid #C9D1CC; background: #FFFFFF; font-size: clamp(16px, 3.12vw, 22px); font-weight: 700; color: #1B1F23; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      Ouvir a frase
    </button>
    <div style="font-size: clamp(26px, 5.5vw, 42px); font-weight: 700; line-height: 1.4; text-align: center">{{antes}} <span style="{{lacunaStyle}}">{{lacuna}}</span>{{depois}}</div>
  </div>

  <template data-k="if" value="{{jogando}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 22px">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 16px">
        <template data-k="for" list="{{opcoes}}" as="o" hint-placeholder-count="3">
          <button class="opt" onClick="{{o.pick}}" aria-disabled="{{o.off}}" aria-label="{{o.aria}}" style="{{o.style}}">{{o.label}}</button>
        </template>
      </div>
      <template data-k="if" value="{{erro}}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="background: #FFF4D6; border: 2px solid #E2C46A; border-radius: 20px; padding: 18px 22px; font-size: clamp(18px, 3.65vw, 26px); color: #4A3800; text-align: center">Quase! Tente outra vez. Você consegue.</div>
      </template>
    </div>
  </template>

  <template data-k="if" value="{{acertou}}" hint-placeholder-val="{{ false }}">
    <div style="background: #E4EEE6; border: 3px solid #1E6B3A; border-radius: 28px; padding: clamp(20px, 4vw, 28px); display: flex; flex-direction: column; align-items: center; gap: 18px">
      <div style="display: flex; align-items: center; gap: 16px">
        <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 50%; background: #1E6B3A; display: flex; align-items: center; justify-content: center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div role="status" style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: clamp(22px, 4.43vw, 34px); font-weight: 700; color: #14532B">Muito bem!</div>
          <div style="font-size: clamp(18px, 3.12vw, 24px); color: #1B1F23">{{elogio}}</div>
        </div>
      </div>
      <button onClick="{{avancar}}" style="font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 10px; height: 68px; padding: 0 22px; border-radius: 22px; border: none; background: #1E6B3A; color: #FFFFFF; font-size: clamp(20px, 3.91vw, 30px); font-weight: 700">
        {{avancarLabel}}
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </template>

  <div style="margin-top: auto; font-size: 20px; color: #4A5560; text-align: center">Toque na palavra que completa a frase. Não tem tempo: vá com calma.</div>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Banco de frases (sugestões a validar com a fonoaudióloga). A cada vez,
    // o app sorteia 5 delas e embaralha as opções.
    const banco = [
      { antes: 'Depois da noite vem o', depois: '.', correta: 'dia', opcoes: ['dia', 'chuva', 'livro'] },
      { antes: 'De manhã, eu tomo café com', depois: '.', correta: 'leite', opcoes: ['leite', 'pedra', 'cadeira'] },
      { antes: 'Quem tem boca vai a', depois: '.', correta: 'Roma', opcoes: ['Roma', 'janela', 'colher'] },
      { antes: 'Para abrir a porta, eu uso a', depois: '.', correta: 'chave', opcoes: ['chave', 'meia', 'banana'] },
      { antes: 'Quando chove, eu abro o', depois: '.', correta: 'guarda-chuva', opcoes: ['guarda-chuva', 'forno', 'sapato'] },
      { antes: 'O céu está azul e o', depois: ' está brilhando.', correta: 'sol', opcoes: ['sol', 'peixe', 'garfo'] },
      { antes: 'Em boca fechada não entra', depois: '.', correta: 'mosca', opcoes: ['mosca', 'carro', 'mesa'] },
      { antes: 'Escovo os dentes com pasta e', depois: '.', correta: 'escova', opcoes: ['escova', 'martelo', 'bolo'] },
      { antes: 'Mais vale um pássaro na mão do que dois', depois: '.', correta: 'voando', opcoes: ['voando', 'dormindo', 'cozinhando'] },
      { antes: 'Água mole em pedra dura, tanto bate até que', depois: '.', correta: 'fura', opcoes: ['fura', 'canta', 'esfria'] }
    ];
    const embaralhar = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
    this.frases = embaralhar(banco).slice(0, 5).map((f) => Object.assign({}, f, { opcoes: embaralhar(f.opcoes) }));
    this.elogios = ['Você completou a frase certinho.', 'Isso mesmo! Ótima resposta.', 'Perfeito! Continue assim.', 'Muito bom! Você está indo bem.', 'Excelente! Você terminou todas.'];
    this.state = { idx: 0, erradas: [], erro: false, acertou: false };
  }
  componentWillUnmount() { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { } }
  falar(txt) {
    try {
      const synth = window.speechSynthesis;
      if (!synth) return;
      if (synth.speaking) { synth.cancel(); return; }
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'pt-BR';
      u.rate = 0.9;
      synth.cancel();
      synth.speak(u);
    } catch (e) { }
  }
  escolher(op) {
    const { acertou, erradas } = this.state;
    const f = this.frases[this.state.idx];
    if (acertou || erradas.indexOf(op) >= 0) return;
    if (op === f.correta) this.setState({ acertou: true, erro: false });
    else this.setState({ erro: true, erradas: erradas.concat([op]) });
  }
  avancar() {
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { }
    if (this.state.idx + 1 >= this.frases.length) { location.href = 'Idoso-Concluido.html?a=l1'; return; }
    this.setState({ idx: this.state.idx + 1, erradas: [], erro: false, acertou: false });
  }
  renderVals() {
    const self = this;
    const { idx, erradas, erro, acertou } = this.state;
    const f = this.frases[idx];
    const total = this.frases.length;
    const base = 'height: 84px; border-radius: 22px; font-size: clamp(22px, 4.43vw, 34px); font-weight: 700; ';
    const opcoes = f.opcoes.map(function (label) {
      const off = erradas.indexOf(label) >= 0;
      return {
        label: label,
        off: off ? 'true' : 'false',
        aria: off ? label + ' (não é essa)' : label,
        style: base + (off
          ? 'border: 3px dashed #C9D1CC; background: #F4F6F3; color: #4A5560; text-decoration: line-through'
          : 'border: 3px solid #5B3F9E; background: #FFFFFF; color: #3A2A66'),
        pick: function () { self.escolher(label); }
      };
    });
    const passos = this.frases.map(function (_, i) {
      const cor = i < idx || (i === idx && acertou) ? '#1E6B3A' : (i === idx ? '#5B3F9E' : '#C9D1CC');
      return { style: 'width: ' + (i === idx ? '36px' : '18px') + '; height: 18px; border-radius: 9px; background: ' + cor };
    });
    const ultima = idx + 1 >= total;
    return {
      numero: idx + 1, total: total, passos: passos,
      antes: f.antes,
      depois: f.depois,
      lacuna: acertou ? f.correta : ' ',
      lacunaStyle: acertou
        ? 'display: inline-block; padding: 0 8px; border-bottom: 4px solid #1E6B3A; color: #1E6B3A'
        : 'display: inline-block; min-width: 96px; border-bottom: 4px solid #5B3F9E; vertical-align: middle',
      jogando: !acertou,
      acertou: acertou,
      erro: erro,
      opcoes: opcoes,
      elogio: ultima ? this.elogios[4] : this.elogios[idx % 4],
      avancarLabel: ultima ? 'Terminar' : 'Próxima frase',
      avancar: function () { self.avancar(); },
      ouvir: function () {
        const fr = self.frases[self.state.idx];
        self.falar(self.state.acertou ? fr.antes + ' ' + fr.correta + fr.depois : fr.antes + '... ' + fr.depois);
      }
    };
  }
}
</script>
</body>
</html>
