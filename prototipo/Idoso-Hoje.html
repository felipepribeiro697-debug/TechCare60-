<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">

h1{overflow-wrap:anywhere}

a{color:#0B5D66}a:hover{color:#08434A}

<style>

  #dc-root{padding:24px 0}

.tc-home:hover{opacity:1;color:#fff}
</style>

</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; max-width: 768px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: clamp(16px, 5.73vw, 44px) clamp(16px, 7.29vw, 56px); display: flex; flex-direction: column; gap: 28px; background: #F4F6F3; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1B1F23; zoom: {{zoom}}">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
    <div style="display: flex; align-items: center; gap: 16px; flex: 1 1 auto; min-width: 0">
      <div style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 36px; background: #E3F0F1; display: flex; align-items: center; justify-content: center; font-size: clamp(21px, 4.17vw, 32px); font-weight: 700; color: #0B5D66">M</div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <div style="font-size: clamp(24px, 4.69vw, 36px); font-weight: 700">Bom dia, Maria!</div>
        <div style="font-size: clamp(16px, 3.2vw, 22px); color: #4A5560">Terça-feira, 20 de outubro</div>
      </div>
    </div>
    <button onClick="{{aumentar}}" aria-label="Aumentar o tamanho da letra" style="font-family: inherit; flex-shrink: 0; display: flex; align-items: center; gap: 6px; height: 64px; padding: 0 20px; border-radius: 18px; border: 2px solid #C9D1CC; background: #FFFFFF; font-size: clamp(18px, 3.39vw, 26px); font-weight: 700; color: #1B1F23">A<span style="font-size: clamp(22px, 4.43vw, 34px)">A</span>+</button>
  </div>

  <div style="background: #FFFFFF; border-radius: 24px; border: 2px solid #C9D1CC; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: clamp(18px, 3.65vw, 28px); font-weight: 700">Suas atividades de hoje</div>
      <div style="font-size: clamp(18px, 3.39vw, 26px); color: #1E6B3A; font-weight: 700">1 de 3 feitas</div>
    </div>
    <div style="height: 18px; border-radius: 9px; background: #E1E6E2; overflow: hidden">
      <div style="width: 33%; height: 18px; border-radius: 9px; background: #1E6B3A"></div>
    </div>
  </div>

  <a href="Idoso-Instrucao.html" style="text-decoration: none; color: #1B1F23; background: #FFFFFF; border: 3px solid #0B5D66; border-radius: 28px; padding: clamp(16px, 3.4vw, 26px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(14px, 3.1vw, 24px)">
    <div style="width: clamp(63px, 14.58vw, 112px); height: clamp(63px, 14.58vw, 112px); flex-shrink: 0; border-radius: 24px; background: #E3F0F1; display: flex; align-items: center; justify-content: center">
      <svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#0B5D66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="7" height="9" rx="1.5"/><rect x="14" y="4" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/><path d="M6.5 7.5v2M17.5 7.5v2"/></svg>
    </div>
    <div style="flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 20px; font-weight: 700; color: #0B5D66; letter-spacing: 0.5px">MEMÓRIA</div>
      <div style="font-size: clamp(22px, 4.43vw, 34px); font-weight: 700">Jogo da memória</div>
      <div style="font-size: 22px; color: #4A5560">Cerca de 5 minutos</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 72px; padding: 0 24px; border-radius: 20px; background: #0B5D66; color: #FFFFFF; font-size: clamp(18px, 3.65vw, 28px); font-weight: 700">
      Fazer
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </a>

  <div style="background: #FFFFFF; border: 2px solid #C9D1CC; border-radius: 28px; padding: clamp(16px, 3.4vw, 26px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(14px, 3.1vw, 24px)">
    <div style="width: clamp(63px, 14.58vw, 112px); height: clamp(63px, 14.58vw, 112px); flex-shrink: 0; border-radius: 24px; background: #FBE9DF; display: flex; align-items: center; justify-content: center">
      <svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#9A3A0C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/><path d="M8.5 11h5M11 8.5v5"/></svg>
    </div>
    <div style="flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 20px; font-weight: 700; color: #9A3A0C; letter-spacing: 0.5px">ATENÇÃO</div>
      <div style="font-size: clamp(22px, 4.43vw, 34px); font-weight: 700">Encontre o diferente</div>
      <div style="font-size: 22px; color: #4A5560">Feita no atendimento</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 72px; padding: 0 22px; border-radius: 20px; background: #E4EEE6; color: #1E6B3A; font-size: clamp(18px, 3.65vw, 28px); font-weight: 700">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1E6B3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      Feita
    </div>
  </div>

  <a href="Idoso-Lembrete.html" style="text-decoration: none; color: #1B1F23; background: #FFFFFF; border: 2px solid #C9D1CC; border-radius: 28px; padding: clamp(16px, 3.4vw, 26px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(14px, 3.1vw, 24px)">
    <div style="width: clamp(63px, 14.58vw, 112px); height: clamp(63px, 14.58vw, 112px); flex-shrink: 0; border-radius: 24px; background: #ECE6F7; display: flex; align-items: center; justify-content: center">
      <svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#5B3F9E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
    </div>
    <div style="flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 20px; font-weight: 700; color: #5B3F9E; letter-spacing: 0.5px">LINGUAGEM</div>
      <div style="font-size: clamp(22px, 4.43vw, 34px); font-weight: 700">Complete a frase</div>
      <div style="font-size: 22px; color: #4A5560">Lembrete às 15h</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 72px; padding: 0 24px; border-radius: 20px; background: #FFFFFF; border: 3px solid #0B5D66; color: #0B5D66; font-size: clamp(18px, 3.65vw, 28px); font-weight: 700">
      Fazer
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0B5D66" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </a>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
    <button onClick="{{ouvir}}" style="font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 12px; height: 84px; border-radius: 22px; border: 2px solid #C9D1CC; background: #FFFFFF; font-size: clamp(18px, 3.39vw, 26px); font-weight: 700; color: #1B1F23">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      Ouvir esta tela
    </button>
    <a href="Main.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 84px; box-sizing: border-box; border-radius: 22px; border: 2px solid #C9D1CC; background: #FFFFFF; font-size: clamp(18px, 3.39vw, 26px); font-weight: 700; color: #1B1F23; text-decoration: none">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      Sair
    </a>
  </div>
</div>
</template>
<div id="dc-root"></div>
<a class="tc-home" href="../index.html">Início</a>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fz: 0 };
    this.levels = [1, 1.12, 1.25];
  }
  ouvir() {
    try {
      const synth = window.speechSynthesis;
      if (!synth) return;
      if (synth.speaking) { synth.cancel(); return; }
      const root = document.getElementById('dc-root');
      let txt = root ? (root.innerText || root.textContent || '') : '';
      txt = txt.replace(/Ouvir esta tela/gi, ' ').replace(/A\s*A\s*\+/g, ' ').replace(/\s+/g, ' ').trim();
      if (!txt) return;
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'pt-BR';
      u.rate = 0.95;
      synth.cancel();
      synth.speak(u);
    } catch (e) { }
  }
  renderVals() {
    const self = this;
    const zoom = this.levels[this.state.fz] || 1;
    return {
      zoom: zoom,
      aumentar: function () { self.setState({ fz: (self.state.fz + 1) % self.levels.length }); },
      ouvir: function () { self.ouvir(); }
    };
  }
}
</script>
</body>
</html>
