<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechCare 60+ – Jogo da memória</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
h1{overflow-wrap:anywhere}
body{margin:0}
a{color:#0B5D66}a:hover{color:#08434A}
.card{font-family:inherit;cursor:pointer;padding:0}
</style>
<style>
body{background:#DDE3DF}
#dc-root>*{background-color:#F4F6F3}
@media (min-width: 820px){
  #dc-root{padding:24px 0}
  #dc-root>*{min-height:calc(100vh - 48px) !important;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden}
}
@media (max-width: 819px){#dc-root{padding-bottom:64px}}
.tc-home{position:fixed;right:16px;bottom:16px;z-index:50;font:600 14px/1 system-ui,sans-serif;background:#183236;color:#fff;text-decoration:none;padding:10px 14px;border-radius:999px;opacity:.85}
.tc-home:hover{opacity:1;color:#fff}
</style>
<script src="../assets/dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; max-width: 768px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: clamp(16px, 5.73vw, 44px) clamp(16px, 7.29vw, 56px); display: flex; flex-direction: column; gap: 28px; background: #F4F6F3; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1B1F23">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <a href="Idoso-Hoje.html" style="display: flex; align-items: center; gap: 10px; font-size: clamp(18px, 3.12vw, 24px); font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 16px; background: #FFFFFF; border: 2px solid #C9D1CC; color: #1B1F23">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#1B1F23" stroke="none" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      Pausar
    </a>
    <button aria-label="Ouvir a explicação" style="font-family: inherit; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 20px; border-radius: 16px; border: 2px solid #C9D1CC; background: #FFFFFF; font-size: clamp(18px, 3.12vw, 24px); font-weight: 700; color: #1B1F23">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      Ouvir
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: clamp(26px, 5.21vw, 40px)">Jogo da memória</h1>
    <div style="font-size: clamp(18px, 3.65vw, 28px); color: #2B333A">Pares encontrados: <b>{{found}} de 4</b></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2.6vw, 20px)">
    <template data-k="for" list="{{cards}}" as="c" hint-placeholder-count="8">
      <button class="card" onClick="{{c.flip}}" aria-label="{{c.aria}}" style="{{c.style}}">
        <template data-k="if" value="{{c.hidden}}" hint-placeholder-val="{{ true }}">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </template>
        <template data-k="if" value="{{c.isSol}}" hint-placeholder-val="{{ false }}">
          <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#7A5B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </template>
        <template data-k="if" value="{{c.isCasa}}" hint-placeholder-val="{{ false }}">
          <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#7A5B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
        </template>
        <template data-k="if" value="{{c.isFlor}}" hint-placeholder-val="{{ false }}">
          <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#7A5B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="2"/><path d="M12 6a2.5 2.5 0 1 1 2 -3.5M14 8a2.5 2.5 0 1 1 1.5 3.5M12 10a2.5 2.5 0 1 1 -2 3.5M10 8a2.5 2.5 0 1 1 -1.5 -3.5"/><path d="M12 10v11M12 17c-2 0-4-1.5-4-3.5M12 15c2 0 4-1.5 4-3"/></svg>
        </template>
        <template data-k="if" value="{{c.isCoracao}}" hint-placeholder-val="{{ false }}">
          <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#7A5B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-9.3-8.7A5.2 5.2 0 0 1 12 6.1a5.2 5.2 0 0 1 9.3 5.2C19 15.6 12 20 12 20z"/></svg>
        </template>
        <template data-k="if" value="{{c.shown}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: clamp(18px, 3.12vw, 24px); font-weight: 700; color: #5C4400">{{c.word}}</span>
        </template>
      </button>
    </template>
  </div>

  <template data-k="if" value="{{done}}" hint-placeholder-val="{{ false }}">
    <div style="background: #E4EEE6; border: 3px solid #1E6B3A; border-radius: 28px; padding: 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: clamp(22px, 4.43vw, 34px); font-weight: 700; color: #14532B">Muito bem!</div>
        <div style="font-size: clamp(18px, 3.12vw, 24px); color: #1B1F23">Você encontrou todos os pares.</div>
      </div>
      <a href="Idoso-Concluido.html" style="display: flex; align-items: center; gap: 10px; height: 84px; padding: 0 30px; border-radius: 22px; background: #1E6B3A; color: #FFFFFF; font-size: clamp(20px, 3.91vw, 30px); font-weight: 700; text-decoration: none">
        Continuar
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </template>
  <template data-k="if" value="{{playing}}" hint-placeholder-val="{{ true }}">
    <div style="background: #FFFFFF; border: 2px solid #C9D1CC; border-radius: 24px; padding: 22px 26px; font-size: clamp(18px, 3.39vw, 26px); line-height: 1.4; color: #2B333A">{{hint}}</div>
  </template>

  <div style="margin-top: auto; font-size: 20px; color: #4A5560; text-align: center">Se precisar parar, toque em Pausar. Seu progresso fica guardado.</div>
</div>
</template>
<div id="dc-root"></div>
<a class="tc-home" href="../index.html">← Índice</a>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.deck = ['sol', 'casa', 'flor', 'coracao', 'casa', 'coracao', 'sol', 'flor'];
    this.words = { sol: 'SOL', casa: 'CASA', flor: 'FLOR', coracao: 'CORAÇÃO' };
    this.state = { open: [], matched: [], lastMiss: false };
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  flip(i) {
    const { open, matched } = this.state;
    if (open.length >= 2 || open.includes(i) || matched.includes(i)) return;
    const next = open.concat([i]);
    if (next.length < 2) { this.setState({ open: next, lastMiss: false }); return; }
    const [a, b] = next;
    if (this.deck[a] === this.deck[b]) {
      this.setState({ open: [], matched: matched.concat([a, b]), lastMiss: false });
    } else {
      this.setState({ open: next });
      this.timer = setTimeout(() => this.setState({ open: [], lastMiss: true }), 1300);
    }
  }
  renderVals() {
    const { open, matched, lastMiss } = this.state;
    const base = 'width: 100%; aspect-ratio: 3 / 4; height: auto; border-radius: clamp(12px, 2.6vw, 20px); box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; ';
    const cards = this.deck.map((k, i) => {
      const isMatched = matched.includes(i);
      const shown = isMatched || open.includes(i);
      let style;
      if (!shown) style = base + 'background: #0B5D66; border: 3px solid #0B5D66;';
      else if (isMatched) style = base + 'background: #E4EEE6; border: 4px solid #1E6B3A;';
      else style = base + 'background: #FFF4D6; border: 4px solid #B88A00;';
      return {
        hidden: !shown, shown,
        isSol: shown && k === 'sol', isCasa: shown && k === 'casa',
        isFlor: shown && k === 'flor', isCoracao: shown && k === 'coracao',
        word: this.words[k], style,
        aria: shown ? this.words[k] : 'Carta virada ' + (i + 1),
        flip: () => this.flip(i)
      };
    });
    const found = matched.length / 2;
    let hint = 'Toque em uma carta para começar.';
    if (open.length === 1) hint = 'Agora toque em outra carta.';
    else if (open.length === 2) hint = 'Essas são diferentes. Elas vão virar de novo.';
    else if (lastMiss) hint = 'Tudo bem! Tente outra vez.';
    else if (found > 0) hint = 'Você achou um par! Continue assim.';
    return { cards, found, done: found === 4, playing: found < 4, hint };
  }
}
</script>
</body>
</html>
