<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>TechCare 60+ – Login do profissional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5D66}a:hover{color:#08434A}
input:focus{outline:3px solid #0B5D66;outline-offset:1px}
</style>
<style>
#dc-root{min-height:100vh}
@media (max-width: 819px){#dc-root{padding-bottom:64px}}
.tc-home{position:fixed;right:16px;bottom:16px;z-index:50;font:600 14px/1 system-ui,sans-serif;background:#183236;color:#fff;text-decoration:none;padding:10px 14px;border-radius:999px;opacity:.85}
.tc-home:hover{opacity:1;color:#fff}
</style>
<script src="../assets/dc-lite.js"></script>

</head>
<body>
<template id="dc-tpl">
<div style="min-height: 820px; box-sizing: border-box; padding: 48px 20px; display: flex; align-items: center; justify-content: center; background: #F4F6F3; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1B1F23">
  <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 12px; justify-content: center">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #0B5D66; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/><path d="M8 12h2l1.5-2.5L13 14l1.5-2H16"/></svg>
      </div>
      <div style="font-size: 24px; font-weight: 700">TechCare 60+</div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #D5DBD7; border-radius: 16px; padding: 36px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px">Área do profissional</h1>
        <p style="margin: 0; font-size: 16px; color: #4A5560">Entre para acompanhar os idosos sob seus cuidados.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="email" style="font-size: 15px; font-weight: 700">E-mail</label>
        <input id="email" type="email" value="fono.exemplo@clinica.com" style="font-family: inherit; font-size: 16px; height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #9AA6A0; border-radius: 10px; color: #1B1F23">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="senha" style="font-size: 15px; font-weight: 700">Senha</label>
        <input id="senha" type="password" value="12345678" style="font-family: inherit; font-size: 16px; height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #9AA6A0; border-radius: 10px; color: #1B1F23">
      </div>
      <a href="Prof-Idosos.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 10px; background: #0B5D66; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Entrar</a>
      <a href="#" style="align-self: center; font-size: 15px">Esqueci minha senha</a>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #4A5560; line-height: 1.5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Acesso restrito a profissionais cadastrados. Os dados dos idosos são tratados conforme a LGPD.
    </div>
    <a href="Main.html" style="align-self: center; font-size: 15px">Ir para o app do idoso</a>
  </div>
</div>
</template>
<div id="dc-root"></div>
<a class="tc-home" href="../index.html">Início</a>

  }

</script>
</body>
</html>
