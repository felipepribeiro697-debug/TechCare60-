<!doctype html>
<html lang="pt-BR" data-app="idoso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>TechCare 60+ – Digitar PIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
h1{overflow-wrap:anywhere}
body{margin:0}
a{color:#0B5D66}a:hover{color:#08434A}
.key{font-family:inherit;cursor:pointer}
.key:active{background:#E3F0F1}
@keyframes tcShake{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@media (prefers-reduced-motion: reduce){.pin-dots{animation:none !important}}
@media (max-width: 480px){.pin-ajuda-ic{display:none}.pin-topo{font-size:16px !important;gap:4px !important;padding:10px 12px !important}.pin-topo.voltar{padding-left:4px !important}.pin-topo svg{width:24px;height:24px}}
</style>
<style>
body{background:#DDE3DF}
#dc-root>*{background-color:#F4F6F3}
@media (min-width: 820px){
  #dc-root{padding:24px 0}
  #dc-root>*{min-height:calc(100vh - 48px) !important;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden}
}

.tc-home{position:fixed;right:16px;bottom:16px;z-index:50;font:600 14px/1 system-ui,sans-serif;background:#183236;color:#fff;text-decoration:none;padding:10px 14px;border-radius:999px;opacity:.85}
.tc-home:hover{opacity:1;color:#fff}
</style>
<script src="../assets/tema.js"></script>
<script src="../assets/store.js"></script>
<script src="../assets/dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; max-width: 768px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; padding: clamp(16px, 6.25vw, 48px) clamp(16px, 7.29vw, 56px); display: flex; flex-direction: column; align-items: center; gap: 32px; background: #F4F6F3; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1B1F23">
  <div style="align-self: stretch; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: stretch; gap: 10px">
    <a href="Main.html" class="pin-topo voltar" style="display: flex; align-items: center; gap: 8px; font-size: clamp(17px, 3.12vw, 24px); font-weight: 700; text-decoration: none; padding: 12px 18px 12px 8px; border-radius: 16px; background: #FFFFFF; border: 2px solid #C9D1CC; color: #1B1F23">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Voltar
    </a>
    <a href="Idoso-Recuperar.html" class="pin-topo" style="display: flex; align-items: center; gap: 8px; font-size: clamp(17px, 3.12vw, 24px); font-weight: 700; text-decoration: none; padding: 12px 16px; border-radius: 16px; background: #FFFFFF; border: 2px solid #0B5D66; color: #0B5D66">
      <svg class="pin-ajuda-ic" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B5D66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      Esqueci meu PIN
    </a>
  </div>

  <template data-k="if" value="{{redefinido}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="align-self: stretch; display: flex; align-items: center; gap: 12px; background: #E4EEE6; border: 2px solid #9CC3A8; border-radius: 18px; padding: 14px 18px; font-size: clamp(18px, 3.4vw, 24px); color: #14532B; line-height: 1.35">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E6B3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      PIN alterado. Entre com o seu PIN novo.
    </div>
  </template>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="width: clamp(67px, 15.62vw, 120px); height: clamp(67px, 15.62vw, 120px); border-radius: 50%; background: #E3F0F1; display: flex; align-items: center; justify-content: center; font-size: clamp(33px, 6.51vw, 50px); font-weight: 700; color: #0B5D66">{{inicial}}</div>
    <h1 style="margin: 0; font-size: clamp(26px, 5.21vw, 40px)">Olá, {{primeiro}}!</h1>
    <p style="margin: 0; font-size: clamp(18px, 3.65vw, 28px); color: #2B333A">Digite seus 4 números secretos.</p>
  </div>

  <div class="pin-dots" style="{{dotsWrap}}" aria-label="Números digitados">
    <template data-k="for" list="{{dots}}" as="dot" hint-placeholder-count="4">
      <div style="{{dot.style}}"></div>
    </template>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%; max-width: 480px">
    <template data-k="for" list="{{keys}}" as="k" hint-placeholder-count="9">
      <button class="key" onClick="{{k.press}}" style="height: 96px; border-radius: 22px; border: 2px solid #C9D1CC; background: #FFFFFF; font-size: clamp(29px, 5.73vw, 44px); font-weight: 700; color: #1B1F23">{{k.label}}</button>
    </template>
    <button class="key" onClick="{{clear}}" aria-label="Apagar o último número" title="Apagar" style="height: 96px; border-radius: 22px; border: 2px solid #C9D1CC; background: #FFFFFF; color: #1B1F23; display: flex; align-items: center; justify-content: center">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1B1F23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M18 9l-6 6M12 9l6 6"/></svg>
    </button>
    <button class="key" onClick="{{zero}}" style="height: 96px; border-radius: 22px; border: 2px solid #C9D1CC; background: #FFFFFF; font-size: clamp(29px, 5.73vw, 44px); font-weight: 700; color: #1B1F23">0</button>
    <div></div>
  </div>

  <template data-k="if" value="{{complete}}" hint-placeholder-val="{{ false }}">
    <a href="Idoso-Hoje.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 480px; height: clamp(54px, 12.50vw, 96px); border-radius: 16px; background: #0B5D66; color: #FFFFFF; font-size: clamp(22px, 4.43vw, 34px); font-weight: 700; text-decoration: none">
      Entrar
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </template>
  <template data-k="if" value="{{erro}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="width: 100%; max-width: 480px; box-sizing: border-box; background: #FDECE6; border: 2px solid #B4430F; border-radius: 18px; padding: 16px 20px; font-size: clamp(18px, 3.4vw, 24px); color: #7A2A08; text-align: center; line-height: 1.35">Esse PIN não está certo. Tente de novo, com calma. Se esqueceu, toque em “Esqueci meu PIN”.</div>
  </template>
</div>
</template>
<div id="dc-root"></div>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let redefinido = false;
    try { redefinido = new URLSearchParams(location.search).get('redefinido') === '1'; } catch (e) { }
    this.state = { pin: '', erro: false, redefinido: redefinido };
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  add(d) {
    if (this.state.pin.length >= 4) return;
    clearTimeout(this.timer);
    const pin = this.state.pin + d;
    // Ao completar 4 números, confere com o PIN cadastrado pelo profissional.
    if (pin.length < 4 || !window.TC || TC.checkPin(pin)) { this.setState({ pin: pin, erro: false }); return; }
    this.setState({ pin: pin, erro: true });
    this.timer = setTimeout(() => this.setState({ pin: '' }), 1100);
  }
  renderVals() {
    const idoso = (window.TC ? TC.current() : null) || { nome: 'Maria Aparecida Souza' };
    const primeiro = (idoso.nome || 'Idoso').trim().split(/\s+/)[0];
    const inicial = (primeiro.charAt(0) || 'I').toUpperCase();
    const { pin, erro } = this.state;
    const n = pin.length;
    const cor = erro ? '#B4430F' : '#0B5D66';
    const dots = [0, 1, 2, 3].map((i) => ({
      style: 'width: 40px; height: 40px; border-radius: 20px; box-sizing: border-box; border: 4px solid ' + cor + '; background: ' + (i < n ? cor : '#FFFFFF')
    }));
    const keys = ['1','2','3','4','5','6','7','8','9'].map((d) => ({ label: d, press: () => this.add(d) }));
    const certo = n === 4 && !erro;
    return {
      primeiro, inicial,
      dots,
      dotsWrap: 'display: flex; gap: 24px' + (erro && n === 4 ? '; animation: tcShake .45s ease' : ''),
      keys,
      zero: () => this.add('0'),
      clear: () => { clearTimeout(this.timer); this.setState({ pin: this.state.pin.slice(0, -1), erro: false }); },
      complete: certo,
      erro: erro,
      redefinido: this.state.redefinido && !erro
    };
  }
}
</script>
</body>
</html>
